name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nova-linux-rust185-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            nova-linux-rust185-${{ hashFiles('Cargo.lock') }}-
            nova-linux-rust185-
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build console and install Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint:colors
          npm run build
          npx playwright install --with-deps chromium
      - name: Install pinned CI toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt
      - name: Check and test
        run: |
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 clippy --workspace --locked --all-features --all-targets -- -D warnings
          cargo +1.85.1 test --workspace --locked --all-features
          cargo +1.85.1 build --release --locked -p wbpc-server --features web-ui
      - name: Verify binary, auth and browser workflows with real Redis
        env:
          WBP_DATA_DIR: ${{ runner.temp }}/nova/data
          WBP_ACCESS_DIR: ${{ runner.temp }}/nova/accounts
          WBP_ADDR: 127.0.0.1:3040
        run: |
          target/release/wbpc-server > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --noproxy '*' --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3040/health | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:3040/api/version | jq -e '.version != ""'
          export WBP_E2E_URL=http://127.0.0.1:3040 WBP_E2E_PASSWORD="$(openssl rand -hex 24)"
          node web/scripts/setup-test.mjs
          node web/scripts/batch-test.mjs
          npm --prefix web test
      - name: Show sanitized UI status on browser failure
        if: failure()
        run: |
          find web/test-results -name error-context.md -exec grep -E '批次处理完成|后台导入|共 [0-9]+ 个账号|没有匹配的账号|dialog |alert:' {} ';' || true
      - name: Package release binary and ready-to-load Docker image
        run: |
          mkdir -p bundle
          install -m 0755 target/release/wbpc-server bundle/wbpc-server
          docker build --file deploy/Dockerfile.runtime -t wbpc-nova:test bundle
          docker save wbpc-nova:test redis:7-alpine | gzip -1 > bundle/wbpc-nova-image.tar.gz
          cp docker-compose.yaml README.md bundle/
          (cd bundle && sha256sum wbpc-server wbpc-nova-image.tar.gz docker-compose.yaml > SHA256SUMS)
          tar -C bundle -czf wbpc-nova-linux-amd64.tar.gz .
          sha256sum wbpc-nova-linux-amd64.tar.gz > wbpc-nova-linux-amd64.tar.gz.sha256
          install -m 0755 deploy/install-test.sh install-test.sh
          shellcheck install-test.sh
          mkdir -m 700 "$RUNNER_TEMP/wwwroot"
          WBP_WWWROOT="$RUNNER_TEMP/wwwroot" WBP_PUBLISH_ADDR=127.0.0.1 WBP_PUBLISH_PORT=13040 bash install-test.sh "$PWD"
          curl -fsS http://127.0.0.1:13040/api/auth/status | jq -e '.needs_setup == true'
          redis_id=$(docker compose -p wbpc-nova-test ps -q redis)
          test -n "$redis_id"
          docker inspect "$redis_id" | jq -e 'length == 1 and ((.[0].HostConfig.PortBindings // {}) | length == 0) and ((.[0].NetworkSettings.Ports["6379/tcp"] // []) | length == 0)'
          docker compose -p wbpc-nova-test down
      - uses: actions/upload-artifact@v4
        with:
          name: wbpc-nova-linux-amd64
          path: |
            wbpc-nova-linux-amd64.tar.gz
            wbpc-nova-linux-amd64.tar.gz.sha256
            install-test.sh
          if-no-files-found: error
          retention-days: 14
