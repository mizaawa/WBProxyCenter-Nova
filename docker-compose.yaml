name: wbpc-nova-test
services:
  app:
    image: wbpc-nova:test
    restart: unless-stopped
    ports:
      - "${WBP_PUBLISH_ADDR:-127.0.0.1}:${WBP_PUBLISH_PORT:-3040}:3040"
    environment:
      WBP_REDIS_URL: redis://redis:6379/0
      WBP_SECURE_COOKIE: "${WBP_SECURE_COOKIE:-0}"
      WBP_ADMIN_PASSWORD: "${WBP_ADMIN_PASSWORD:-}"
    volumes:
      - runtime:/data
      - accounts:/data/access_account
    depends_on:
      redis:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  runtime:
  accounts:
  redis-data:
